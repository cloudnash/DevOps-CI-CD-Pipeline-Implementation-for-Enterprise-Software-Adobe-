#Define your servers here

[jenkins_server]
jenkins-host ansible_host=123.43.22.39 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[production_server]
prod-host ansible_host=10.76.45.21 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3

# ============================================
# ANSIBLE EXPLANATION:
# ============================================
# 
# This Ansible playbook automates server setup:
# 
# JENKINS SERVER SETUP:
# - Installs Java (Jenkins requirement)
# - Installs Jenkins CI/CD server
# - Installs Docker (for building containers)
# - Installs Git (for code checkout)
# - Adds Jenkins to Docker group (permission)
# 
# PRODUCTION SERVER SETUP:
# - Installs Docker (for running containers)
# - Creates web directory (/var/www/html)
# - Installs utilities for health checks
# 
# ============================================
# HOW TO USE:
# ============================================
# 
# 1. Update hosts.ini with your server IPs:
#    Replace YOUR_JENKINS_SERVER_IP and YOUR_PRODUCTION_SERVER_IP
# 
# 2. Run the playbook:
#    ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/setup.yml
# 
# 3. Access Jenkins:
#    http://YOUR_JENKINS_SERVER_IP:8080
# 
# 4. Get initial password:
#    ssh to jenkins server
#    sudo cat /var/lib/jenkins/secrets/initialAdminPassword
# 
# ============================================
